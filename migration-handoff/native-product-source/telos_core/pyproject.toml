[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telos-core"
version = "0.3.0"
description = "Standalone Telos Core contracts, profiles, release declarations and artifact cache"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["telos_core"]
include-package-data = false

[tool.setuptools.package-dir]
telos_core = "."
