[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inputinterfacetelos"
version = "0.1.0"
description = "Stasis: record, edit and restore KotOR input scores"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "kolto-labs"}]
dependencies = []

[project.optional-dependencies]
overlay = ["PySide6>=6.5"]

[project.scripts]
telos = "kptas.telos.cli:main"

[tool.setuptools.packages.find]
include = ["kptas*"]

[tool.setuptools.package-data]
kptas = ["data/*.score"]
"kptas.telos" = ["ui_tokens.json"]

