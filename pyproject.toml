[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inputinterfacetelos"
version = "0.1.0"
description = "Tool-assisted recording and replay for KotOR"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
telos = "kptas.telos.cli:main"

[tool.setuptools]
package-dir = { "" = "KPTASInterface" }

[tool.setuptools.packages.find]
where = ["KPTASInterface"]
include = ["kptas*"]
