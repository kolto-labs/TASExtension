# x87 transcendental sites in the exe (K1 GOG 1.03). Inventory only.
# Produced by an agentdecompile-cli execute-script over the analyzed Ghidra program
# (flow-followed code only), not by tools/inventory_math_sites.py. That tool reads an
# objdump listing and writes the same rows, plus two CRT bytes at 0x0070a535/0x0070a538
# that objdump's linear sweep decodes but that are not reachable code. The shim checks
# the opcode at each address before redirecting.
# fyl2x rows name the constant the site loads into st1 on its one straight-line path:
# ln (fldln2), lg (fldlg2), l2 (fld1), or generic when a jump joins the path or st1 is
# not a constant there. Ghidra's listing and inventory_math_sites.py agree on all 27.

